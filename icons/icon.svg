<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2547" />
      <stop offset="55%" stop-color="#13489e" />
      <stop offset="100%" stop-color="#0e7490" />
    </linearGradient>
    <linearGradient id="hexStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#bae6fd" />
    </linearGradient>
  </defs>
  <!-- Rounded App Tile Background -->
  <rect x="0" y="0" width="512" height="512" rx="112" ry="112" fill="url(#bgGrad)" />
  <!-- Subtle inner border glow -->
  <rect x="16" y="16" width="480" height="480" rx="98" ry="98" fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="6" />
  <!-- Outer Benzene Hexagon -->
  <polygon
    points="256,88 401.5,172 401.5,340 256,424 110.5,340 110.5,172"
    fill="none"
    stroke="url(#hexStroke)"
    stroke-width="30"
    stroke-linejoin="round"
  />
  <!-- Delocalized Pi Ring -->
  <circle
    cx="256"
    cy="256"
    r="92"
    fill="none"
    stroke="#38bdf8"
    stroke-width="24"
    stroke-dasharray="46 34"
    stroke-linecap="round"
  />
  <!-- Center Nucleus Dot -->
  <circle cx="256" cy="256" r="24" fill="#ffffff" />
</svg>
